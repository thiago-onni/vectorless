<template>
  <!-- HF-AGENTS · Agentes carregando · 5 s · 1920x1080
       Placeholders: {{ID}} {{SECTOR}} e, para i = 1..3: {{AGENTE_i}} {{CONHECE_i}}
       Para 2 ou 4 agentes, duplique/remova um .{{ID}}-card e ajuste o loop. -->
  <div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080" data-duration="5">
    <div class="clip {{ID}}-bg" data-start="0" data-duration="5" data-track-index="0"></div>
    <div class="clip {{ID}}-stage" data-start="0" data-duration="5" data-track-index="1">
      <div class="{{ID}}-title">AGENTES DE OFÍCIO</div>
      <div class="{{ID}}-row">
        <div class="{{ID}}-card"><div class="{{ID}}-name">{{AGENTE_1}}</div><div class="{{ID}}-knows"><b>conhece:</b> {{CONHECE_1}}</div><div class="{{ID}}-track"><div class="{{ID}}-fill"></div></div><div class="{{ID}}-ok">✓ pronto</div></div>
        <div class="{{ID}}-card"><div class="{{ID}}-name">{{AGENTE_2}}</div><div class="{{ID}}-knows"><b>conhece:</b> {{CONHECE_2}}</div><div class="{{ID}}-track"><div class="{{ID}}-fill"></div></div><div class="{{ID}}-ok">✓ pronto</div></div>
        <div class="{{ID}}-card"><div class="{{ID}}-name">{{AGENTE_3}}</div><div class="{{ID}}-knows"><b>conhece:</b> {{CONHECE_3}}</div><div class="{{ID}}-track"><div class="{{ID}}-fill"></div></div><div class="{{ID}}-ok">✓ pronto</div></div>
      </div>
    </div>
  </div>
  <style>
    @font-face { font-family: "Inter Tight"; font-weight: 800; src: url("assets/fonts/InterTight-ExtraBold.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/Inter-SemiBold.woff2") format("woff2"); }
    #root { width: 1920px; height: 1080px; position: relative; overflow: hidden; }
    .{{ID}}-bg { position: absolute; inset: 0; background: #0B0F14; }
    .{{ID}}-stage { position: absolute; inset: 0; padding: 140px 140px 0; }
    .{{ID}}-title { font-family: "Inter"; font-weight: 600; font-size: 28px; letter-spacing: 0.08em; color: {{SECTOR}}; margin-bottom: 48px; }
    .{{ID}}-row { display: flex; gap: 40px; }
    .{{ID}}-card { flex: 1; background: #141A22; border: 2px solid #263040; border-radius: 20px; padding: 44px 40px; min-height: 520px; position: relative; }
    .{{ID}}-name { font-family: "Inter Tight"; font-weight: 800; font-size: 56px; color: #F4F6F8; margin-bottom: 28px; }
    .{{ID}}-knows { font-family: "Inter"; font-weight: 600; font-size: 32px; line-height: 1.35; color: #8A96A8; }
    .{{ID}}-knows b { color: #F4F6F8; }
    .{{ID}}-track { position: absolute; left: 40px; right: 40px; bottom: 96px; height: 10px; background: #263040; border-radius: 5px; overflow: hidden; }
    .{{ID}}-fill { width: 0; height: 100%; background: {{SECTOR}}; }
    .{{ID}}-ok { position: absolute; left: 40px; bottom: 36px; font-family: "Inter"; font-weight: 600; font-size: 28px; color: #2BD99F; opacity: 0; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    (function () {
      var id = "{{ID}}";
      var cards = document.querySelectorAll("." + id + "-card");
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("." + id + "-title", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
      cards.forEach(function (card, i) {
        var t = 0.15 + i * 0.35;
        tl.fromTo(card, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t)
          .fromTo(card.querySelector("." + id + "-fill"), { width: "0%" }, { width: "100%", duration: 1.6 + i * 0.4, ease: "power1.inOut" }, t + 0.4)
          .fromTo(card.querySelector("." + id + "-ok"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25 }, t + 2.1 + i * 0.4)
          .to(card, { borderColor: "#2BD99F", duration: 0.25 }, t + 2.1 + i * 0.4);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;
    })();
  </script>
</template>
