<template>
  <!-- HF-ROI · Placar padrão (4 cartões) · 9 s · 1920x1080
       Placeholders: {{ID}} {{SECTOR}}
       {{VEL_ANTES}} {{VEL_DEPOIS}} · {{ROI_VALOR}} {{ROI_PAYBACK}} · {{QUAL_ANTES}} {{QUAL_DEPOIS}} · {{CONS_TEMPO}} {{CONS_CUSTO}}
       Todos os valores vêm de metricas/metricas.yaml. -->
  <div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080" data-duration="9">
    <div class="clip {{ID}}-bg" data-start="0" data-duration="9" data-track-index="0"></div>
    <div class="clip {{ID}}-stage" data-start="0" data-duration="9" data-track-index="1">
      <div class="{{ID}}-title">O PLACAR</div>
      <div class="{{ID}}-grid">
        <div class="{{ID}}-card"><div class="{{ID}}-k">⏱ VELOCIDADE</div><div class="{{ID}}-before">{{VEL_ANTES}}</div><div class="{{ID}}-after">{{VEL_DEPOIS}}</div></div>
        <div class="{{ID}}-card"><div class="{{ID}}-k">💰 ROI</div><div class="{{ID}}-after">{{ROI_VALOR}}</div><div class="{{ID}}-note">payback {{ROI_PAYBACK}}</div></div>
        <div class="{{ID}}-card"><div class="{{ID}}-k">✅ QUALIDADE</div><div class="{{ID}}-before">{{QUAL_ANTES}}</div><div class="{{ID}}-after">{{QUAL_DEPOIS}}</div></div>
        <div class="{{ID}}-card"><div class="{{ID}}-k">🛠 CONSTRUÇÃO</div><div class="{{ID}}-after">{{CONS_TEMPO}}</div><div class="{{ID}}-note">{{CONS_CUSTO}}</div></div>
      </div>
    </div>
  </div>
  <style>
    @font-face { font-family: "Inter Tight"; font-weight: 800; src: url("assets/fonts/InterTight-ExtraBold.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/Inter-SemiBold.woff2") format("woff2"); }
    #root { width: 1920px; height: 1080px; position: relative; overflow: hidden; }
    .{{ID}}-bg { position: absolute; inset: 0; background: #0B0F14; }
    .{{ID}}-stage { position: absolute; inset: 0; padding: 110px 140px 0; }
    .{{ID}}-title { font-family: "Inter"; font-weight: 600; font-size: 28px; letter-spacing: 0.08em; color: {{SECTOR}}; margin-bottom: 40px; }
    .{{ID}}-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .{{ID}}-card { background: #141A22; border: 2px solid #263040; border-radius: 20px; padding: 36px 44px; height: 330px; opacity: 0.25; }
    .{{ID}}-k { font-family: "Inter"; font-weight: 600; font-size: 30px; letter-spacing: 0.08em; color: #8A96A8; margin-bottom: 18px; }
    .{{ID}}-before { font-family: "Inter Tight"; font-weight: 800; font-size: 56px; color: #FF5A5F; text-decoration: line-through; text-decoration-thickness: 5px; }
    .{{ID}}-after { font-family: "Inter Tight"; font-weight: 800; font-size: 110px; line-height: 1.05; color: #2BD99F; }
    .{{ID}}-note { font-family: "Inter"; font-weight: 600; font-size: 34px; color: #F4F6F8; margin-top: 8px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    (function () {
      var id = "{{ID}}";
      var cards = document.querySelectorAll("." + id + "-card");
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("." + id + "-title", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
      // um cartão acende a cada ~1,8 s, sincronizado com a fala do placar (som de tick em cada entrada)
      cards.forEach(function (card, i) {
        var t = 0.5 + i * 1.8;
        tl.fromTo(card, { opacity: 0.25, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, t)
          .to(card, { borderColor: "{{SECTOR}}", duration: 0.2 }, t);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;
    })();
  </script>
</template>
